<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Ассистент</title>
<!-- Подключаем Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Подключаем бесплатный ИИ -->
<script src="https://js.puter.com/v2/"></script>

<style>
  /* Глобальные переменные (Темная тема по умолчанию) */
  :root {
    --bg: var(--tg-theme-bg-color, #0f172a);
    --text: var(--tg-theme-text-color, #e2e8f0);
    --hint: var(--tg-theme-hint-color, #94a3b8);
    --btn: var(--tg-theme-button-color, #3b82f6);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #1e293b);
    --border: rgba(255,255,255,0.1);
  }

  /* Светлая тема */
  body.light {
    --bg: #f8fafc;
    --text: #0f172a;
    --hint: #64748b;
    --card: #e2e8f0;
    --border: rgba(0,0,0,0.1);
    --btn: #3b82f6;
    --btn-text: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }

  /* ШАПКА */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 10px 15px;
  }
  .header-title { font-weight: bold; font-size: 16px; }
  .menu-btn, .header-spacer { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; background: none; border: none; color: var(--text); }

  /* БОКОВОЕ МЕНЮ */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; z-index: 999; opacity: 0; transition: opacity 0.3s;
  }
  #overlay.show { display: block; opacity: 1; }
  
  #sideMenu {
    position: fixed; left: -280px; top: 0; bottom: 0; width: 280px;
    background: var(--card); z-index: 1000; transition: left 0.3s ease;
    display: flex; flex-direction: column; border-right: 1px solid var(--border);
    box-shadow: 2px 0 10px rgba(0,0,0,0.2);
  }
  #sideMenu.open { left: 0; }
  .menu-header { padding: 20px; border-bottom: 1px solid var(--border); font-weight: bold; font-size: 18px; color: var(--btn); }
  .menu-item {
    padding: 15px 20px; display: flex; align-items: center; gap: 10px;
    cursor: pointer; font-size: 16px; transition: background 0.2s; border-bottom: 1px solid var(--border);
  }
  .menu-item:active { background: rgba(128,128,128,0.2); }

  /* ВКЛАДКИ */
  .tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; padding: 12px 5px; text-align: center; font-size: 14px; font-weight: 600;
    color: var(--hint); cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s;
  }
  .tab.active { color: var(--btn); border-bottom-color: var(--btn); }
  
  /* ЧАТ */
  .content { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .msg { 
    padding: 12px 16px; border-radius: 16px; max-width: 85%; line-height: 1.4; 
    word-wrap: break-word; white-space: pre-wrap; font-size: 15px; animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px);} to {opacity:1; transform: translateY(0);} }
  .user { background: var(--btn); color: var(--btn-text); align-self: flex-end; border-bottom-right-radius: 4px; }
  .bot { background: var(--card); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
  
  /* ВВОД */
  .input-area { display: flex; padding: 10px; gap: 8px; background: var(--card); padding-bottom: env(safe-area-inset-bottom, 10px); border-top: 1px solid var(--border); }
  input {
    flex: 1; padding: 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 16px; outline: none;
  }
  button.send {
    padding: 0 20px; border-radius: 20px; border: none; background: var(--btn); color: var(--btn-text);
    font-weight: bold; font-size: 18px; cursor: pointer;
  }
  button.send:disabled { background: var(--hint); }
  .img-preview { max-width: 100%; border-radius: 12px; margin-top: 5px; }
</style>
</head>
<body>

<!-- БОКОВОЕ МЕНЮ -->
<div id="overlay" onclick="toggleMenu()"></div>
<div id="sideMenu">
  <div class="menu-header">🤖 AI Ассистент</div>
  <div class="menu-item" onclick="clearHistory()">🗑 Очистить историю</div>
  <div class="menu-item" onclick="toggleTheme()">🌗 Сменить тему</div>
  <div class="menu-item" onclick="showAbout()">ℹ️ О приложении</div>
</div>

<!-- ШАПКА -->
<div class="header">
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div class="header-title">AI Ассистент</div>
  <div class="header-spacer"></div>
</div>

<!-- ВКЛАДКИ -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('chat', this)">💬 Чат</div>
  <div class="tab" onclick="switchTab('image', this)">🎨 Картинки</div>
  <div class="tab" onclick="switchTab('translate', this)">🌐 Перевод</div>
</div>

<!-- ОБЛАСТЬ ЧАТА -->
<div class="content" id="chatBox"></div>

<!-- ПОЛЕ ВВОДА -->
<div class="input-area">
  <input id="inp" placeholder="Задай вопрос..." autocomplete="off">
  <button class="send" id="sendBtn" onclick="send()">➤</button>
</div>

<script>
  // Инициализация Telegram WebApp
  let tg = window.Telegram?.WebApp;
  if (tg) { tg.expand(); tg.ready(); }

  let mode = 'chat';
  const chatBox = document.getElementById('chatBox');
  const inp = document.getElementById('inp');
  const sendBtn = document.getElementById('sendBtn');

  // ================= МЕНЮ И ТЕМЫ =================
  function toggleMenu() {
    const menu = document.getElementById('sideMenu');
    const overlay = document.getElementById('overlay');
    menu.classList.toggle('open');
    overlay.classList.toggle('show');
  }

  function toggleTheme() {
    document.body.classList.toggle('light');
    // Запоминаем выбор темы
    if (document.body.classList.contains('light')) {
      localStorage.setItem('theme', 'light');
    } else {
      localStorage.setItem('theme', 'dark');
    }
    toggleMenu(); // Закрываем меню после выбора
  }

  // Применяем сохраненную тему при запуске
  if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light');
  }

  function showAbout() {
    alert("🤖 AI Ассистент v1.0\n\nРаботает на базе бесплатного ИИ Puter.js.\n\nУмеет: общаться, рисовать картинки и переводить текст. Помнит историю диалога.");
  }

  // ================= ЛОГИКА ЧАТА =================
  let chatHistory = JSON.parse(localStorage.getItem('ai_chat_history')) || [
    { role: "assistant", content: "Привет! Я твой ИИ-помощник. Я помню контекст нашего общения. Чем займемся?" }
  ];

  function renderHistory() {
    chatBox.innerHTML = '';
    chatHistory.forEach(msg => {
      if (msg.role !== 'system') addMsgToDOM(msg.content, msg.role === 'user' ? 'user' : 'bot', false);
    });
    scrollToBottom();
  }

  function switchTab(newMode, el) {
    mode = newMode;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    
    if(mode === 'chat') {
      inp.placeholder = "Задай вопрос...";
      chatBox.innerHTML = '';
      renderHistory();
    } else {
      inp.placeholder = mode === 'translate' ? "en: привет (или просто текст)" : "Опиши картинку...";
      chatBox.innerHTML = '';
      addMsgToDOM(
        mode === 'translate' ? "🌐 Режим перевода. Напиши текст (можно указать язык: en: привет)." : "🎨 Опиши картинку, которую нужно нарисовать.", 
        'bot', false
      );
    }
  }

  function addMsgToDOM(text, sender, animate = true) {
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    if (!animate) div.style.animation = 'none';
    div.innerText = text;
    chatBox.appendChild(div);
    scrollToBottom();
    return div;
  }

  function scrollToBottom() {
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function clearHistory() {
    if(confirm("Очистить историю чата?")) {
      chatHistory = [{ role: "assistant", content: "История очищена. О чем поговорим?" }];
      saveHistory();
      renderHistory();
      toggleMenu(); // Закрываем меню
    }
  }

  function saveHistory() {
    if (chatHistory.length > 15) chatHistory = [chatHistory[0], ...chatHistory.slice(-14)];
    localStorage.setItem('ai_chat_history', JSON.stringify(chatHistory));
  }

  // ================= ОТПРАВКА СООБЩЕНИЙ =================
  async function send() {
    const text = inp.value.trim();
    if (!text || sendBtn.disabled) return;

    inp.value = '';
    sendBtn.disabled = true;
    addMsgToDOM(text, 'user');

    if (mode === 'chat') {
      chatHistory.push({ role: "user", content: text });
      saveHistory();
      const botDiv = addMsgToDOM('Думаю...', 'bot');
      
      try {
        const response = await puter.ai.chat(chatHistory, { stream: true });
        let fullResponse = "";
        botDiv.innerText = ""; 
        
        for await (const part of response) {
          if (part?.text) {
            fullResponse += part.text;
            botDiv.innerText = fullResponse;
            scrollToBottom();
          }
        }
        chatHistory.push({ role: "assistant", content: fullResponse });
        saveHistory();
      } catch (e) {
        botDiv.innerText = "❌ Ошибка: " + e.message;
      } finally { sendBtn.disabled = false; }
    } 
    else if (mode === 'image') {
      const botDiv = addMsgToDOM('Рисую...', 'bot');
      try {
        const img = await puter.ai.txt2img(text);
        botDiv.innerText = '';
        const imgEl = document.createElement('img');
        imgEl.src = img.src;
        imgEl.className = 'img-preview';
        botDiv.appendChild(imgEl);
        scrollToBottom();
      } catch (e) { botDiv.innerText = "❌ Ошибка: " + e.message; }
      finally { sendBtn.disabled = false; }
    } 
    else if (mode === 'translate') {
      const botDiv = addMsgToDOM('Перевожу...', 'bot');
      try {
        let target = 'en', content = text;
        if (text.includes(':') && text.split(':')[0].length < 5) {
           target = text.split(':')[0].trim();
           content = text.split(':').slice(1).join(':');
        }
        const response = await puter.ai.chat(`Translate to ${target}. Output ONLY translation: ${content}`);
        botDiv.innerText = response.message ? response.message.content : response;
      } catch (e) { botDiv.innerText = "❌ Ошибка: " + e.message; }
      finally { sendBtn.disabled = false; }
    }
  }

  inp.addEventListener('keypress', (e) => { if (e.key === 'Enter') send(); });

  // Запуск
  renderHistory();
</script>
</body>
</html>
